<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Blitz of Bravery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #0B2016; --bg-elevated: #15301F; --turf: #1D6B3C; --turf-ink: #FFFFFF;
    --gold: #FFB612; --ink: #F3F6F2; --muted: #9DB3A4; --brick: #D22630;
    --leather: #7B4B2A; --good: #3FA85A; --border: rgba(255,182,18,0.18); --shadow: rgba(0,0,0,0.4);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F0F2ED; --bg-elevated: #FFFFFF; --turf: #1C5C35; --turf-ink: #FFFFFF;
      --gold: #C9890A; --ink: #16231A; --muted: #5B6E5F; --brick: #B5202C;
      --leather: #8A5A32; --good: #28793F; --border: rgba(123,75,42,0.18); --shadow: rgba(0,0,0,0.12);
    }
  }
  :root[data-theme="light"] {
    --bg: #F0F2ED; --bg-elevated: #FFFFFF; --turf: #1C5C35; --turf-ink: #FFFFFF;
    --gold: #C9890A; --ink: #16231A; --muted: #5B6E5F; --brick: #B5202C;
    --leather: #8A5A32; --good: #28793F; --border: rgba(123,75,42,0.18); --shadow: rgba(0,0,0,0.12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: "Work Sans", system-ui, -apple-system, sans-serif;
    line-height: 1.45;
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  h1, h2, h3, .num { font-family: "Bebas Neue", "Arial Narrow", sans-serif; letter-spacing: 0.03em; font-weight: 400; }

  .page-flex { min-height: 100%; }
  .turf-frame {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 400'><rect x='0' y='70' width='5' height='18' fill='white' fill-opacity='0.65'/><rect x='0' y='330' width='5' height='18' fill='white' fill-opacity='0.65'/></svg>"),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.9) 0 2px, transparent 2px 5%),
      repeating-linear-gradient(90deg, color-mix(in srgb, var(--turf) 92%, white) 0 10%, color-mix(in srgb, var(--turf) 76%, black) 10% 20%);
    background-size: 5% 400px, auto, auto;
    background-repeat: repeat, repeat, repeat;
  }
  #app { position: relative; z-index: 1; max-width: 640px; width: 100%; margin: 0 auto; padding: 0 0 48px; background: var(--bg); min-height: 100vh; min-height: 100dvh; }
  .yard-bar {
    position: fixed; left: 185px; right: 185px; height: 26px; z-index: 2;
    display: flex; justify-content: space-between; align-items: center; padding: 0 4px;
    pointer-events: none;
    font-family: "Bebas Neue", sans-serif; letter-spacing: 0.02em;
    color: rgba(255,255,255,0.65); text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    font-size: 17px;
  }
  .yard-bar.top { top: 0; }
  .yard-bar.bottom { bottom: 0; }
  @media (max-width: 760px) { .yard-bar { display: none; } }
  .endzone-side {
    position: fixed; top: 0; bottom: 0; width: 185px; z-index: 2;
    display: flex; align-items: center; justify-content: center; pointer-events: none;
  }
  .endzone-side.left {
    left: 0; border-right: 4px solid #3A0A16;
    background:
      linear-gradient(100deg, transparent 28%, rgba(255,255,255,0.3) 44%, rgba(255,255,255,0.08) 53%, transparent 68%),
      radial-gradient(circle at 50% -5%, rgba(255,255,255,0.22), transparent 45%),
      linear-gradient(180deg, #B01A3C 0%, #8E0F2E 22%, #6E0A24 46%, #4E0719 70%, #330310 100%);
    box-shadow: inset -3px 0 6px rgba(0,0,0,0.3), inset 2px 0 1px rgba(255,255,255,0.25);
  }
  .endzone-side.right {
    right: 0; border-left: 4px solid #4A4E53;
    background:
      linear-gradient(100deg, transparent 28%, rgba(255,255,255,0.25) 44%, rgba(255,255,255,0.08) 53%, transparent 68%),
      radial-gradient(circle at 50% -5%, rgba(255,255,255,0.2), transparent 45%),
      linear-gradient(180deg, #C4C9CE 0%, #A9AFB7 22%, #898F96 46%, #686D73 70%, #45484C 100%);
    box-shadow: inset 3px 0 6px rgba(0,0,0,0.25), inset -2px 0 1px rgba(255,255,255,0.3);
  }
  @media (max-width: 900px) { .endzone-side { display: none; } }
  .endzone-svg { height: 172px; width: auto; overflow: visible; }
  .endzone-side.left .endzone-svg { transform: rotate(-90deg); }
  .endzone-side.right .endzone-svg { transform: rotate(90deg); }
  .endzone-letters { font-family: "Playfair Display", serif; font-weight: 900; stroke: #9CA3AC; stroke-width: 1.2; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.35)); }
  .endzone-letters.silver { stroke: #AEB9BE; stroke-width: 1.3; }
  .ez-bolt { position: absolute; width: 17px; height: 17px; border-radius: 50%; z-index: 3; }
  .ez-bolt.gold { background: radial-gradient(circle at 35% 30%, #E4E7EA 0%, #A9AFB7 45%, #5C6269 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.55), inset 0 1px 1px rgba(255,255,255,0.5), inset 0 -1px 2px rgba(0,0,0,0.55); }
  .ez-bolt.silver { background: radial-gradient(circle at 35% 30%, #EEF2F4 0%, #9BA7AD 45%, #4A5257 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.55), inset 0 1px 1px rgba(255,255,255,0.6), inset 0 -1px 2px rgba(0,0,0,0.5); }
  .ez-bolt::after { content: ''; position: absolute; top: 50%; left: 18%; right: 18%; height: 2px; background: rgba(0,0,0,0.45); border-radius: 1px; transform: translateY(-50%) rotate(25deg); }
  .ez-bolt.t1 { top: 14px; left: 10px; } .ez-bolt.t2 { top: 14px; right: 10px; }
  .ez-bolt.b1 { bottom: 14px; left: 10px; } .ez-bolt.b2 { bottom: 14px; right: 10px; }
  .topbar {
    background:
      linear-gradient(100deg, transparent 28%, rgba(255,255,255,0.65) 44%, rgba(255,255,255,0.2) 53%, transparent 68%),
      radial-gradient(circle at 25% -10%, rgba(255,255,255,0.55), transparent 55%),
      linear-gradient(180deg, #FFEC9A 0%, #FBD24A 22%, #F0AC12 45%, #C8860A 68%, #8A5A0B 100%);
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 20px 14px;
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2px;
    border-bottom: 4px solid #6B4A12;
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.25), inset 0 2px 1px rgba(255,255,255,0.6);
  }
  .diamond-text {
    background: linear-gradient(180deg, #ffffff 0%, #f3fbff 25%, #bfe6ff 48%, #ffffff 70%, #e3f5ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 1px 0 rgba(255,255,255,0.85);
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4)) drop-shadow(0 0 14px rgba(255,255,255,0.55));
  }
  .bolt {
    position: absolute; width: 15px; height: 15px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #F3E2BA 0%, #B08A3E 45%, #6B4A1E 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.55), inset 0 1px 1px rgba(255,255,255,0.5), inset 0 -1px 2px rgba(0,0,0,0.55);
  }
  .bolt::after {
    content: ''; position: absolute; top: 50%; left: 18%; right: 18%; height: 2px;
    background: rgba(0,0,0,0.45); border-radius: 1px; transform: translateY(-50%) rotate(25deg);
  }
  .bolt.tl { top: 10px; left: 10px; }
  .bolt.tr { top: 10px; right: 10px; }
  .bolt.bl { bottom: 10px; left: 10px; }
  .bolt.br { bottom: 10px; right: 10px; }
  .brand-svg { width: 100%; max-width: 510px; height: auto; overflow: visible; display: block; }
  .diamond-letters {
    font-family: "Playfair Display", serif; font-weight: 900;
    stroke: #8A6A1E; stroke-width: 1.2;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25));
  }
  .tagline {
    font-family: "Work Sans", sans-serif; font-size: 12px; font-weight: 700;
    letter-spacing: 0.17em; text-transform: uppercase;
    color: #6B4712;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5), 0 -1px 1px rgba(0,0,0,0.35);
    margin: -6px 0 8px;
  }
  .login-hero .tagline { margin: 2px 0 10px; }
  .led-plate {
    background: linear-gradient(180deg, #0A1A10 0%, #04100A 100%);
    border: 2px solid #3A2E0E;
    border-radius: 7px;
    padding: 5px 14px 3px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.6);
  }
  .led-label {
    font-family: "Work Sans", sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.13em;
    color: rgba(255, 214, 10, 0.55); text-align: center; margin-bottom: 1px;
  }
  .led-digits {
    font-family: "Bebas Neue", sans-serif; font-size: 23px; letter-spacing: 0.06em; line-height: 1;
    color: #FFD60A;
    text-shadow: 0 0 5px rgba(255,214,10,0.9), 0 0 12px rgba(255,214,10,0.6), 0 0 24px rgba(255,214,10,0.3);
  }
  .tabs { display: flex; background: var(--bg-elevated); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  .tab { flex: 1; text-align: center; padding: 13px 6px; font-size: 14px; font-weight: 600; color: var(--muted); background: none; border: none; border-bottom: 3px solid transparent; cursor: pointer; min-width: 70px; }
  .tab.active { color: var(--ink); border-bottom-color: var(--gold); }
  .content { padding: 18px 16px 8px; }
  .card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 16px; }
  .modal-box { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 420px; width: 100%; max-height: 85vh; overflow-y: auto; }
  .modal-box h3 { margin-top: 0; }
  .match-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .match-row:last-of-type { border-bottom: none; }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 56px; }
  .pw-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 6px; }
  .pw-toggle:hover { color: var(--ink); }
  #loadbar { position: fixed; top: 0; left: 0; height: 3px; width: 0%; background: var(--gold); z-index: 1000; transition: width 0.2s ease, opacity 0.3s ease; opacity: 0; pointer-events: none; }
  #loadbar.active { width: 70%; opacity: 1; transition: width 8s cubic-bezier(0.1,0.8,0.9,1), opacity 0.2s ease; }
  #toast-host { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--ink); padding: 10px 16px; border-radius: 8px; box-shadow: 0 4px 16px var(--shadow); font-size: 14px; max-width: 90vw; }
  .muted { color: var(--muted); font-size: 13px; }
  .btn { font: inherit; font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--ink); cursor: pointer; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--gold); color: #201800; border-color: transparent; }
  .btn-block { width: 100%; } .btn-danger { color: var(--brick); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  input, select, textarea { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); width: 100%; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; margin-top: 12px; }
  label:first-child { margin-top: 0; }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; }
  .game-row { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .game-row.skipped { opacity: 0.55; }
  .game-row.tiebreaker { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 8%, var(--bg-elevated)); }
  .game-meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .pick-buttons { display: flex; gap: 8px; margin-bottom: 8px; }
  .pick-btn { flex: 1; padding: 10px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; text-align: center; }
  .pick-btn.selected { background: var(--turf); color: var(--turf-ink); border-color: var(--turf); }
  .game-controls { display: flex; gap: 8px; align-items: center; } .game-controls select { flex: 1; }
  .skip-btn { font-size: 12px; padding: 8px 10px; white-space: nowrap; }
  .skip-btn.active { background: var(--brick); color: #fff; border-color: var(--brick); }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--border); color: var(--muted); }
  .badge.gold { background: var(--gold); color: #201800; } .badge.good { background: var(--good); color: #06130c; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  td.num, th.num { text-align: right; font-family: "Bebas Neue", sans-serif; font-size: 17px; letter-spacing: 0.02em; }
  .rank-1 { color: var(--gold); }
  .empty { text-align: center; padding: 30px 12px; color: var(--muted); }
  .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px; }
  .find-me-btn { flex: 0 0 auto; font-size: 12px; font-weight: 700; background: var(--gold); color: #201800; border: none; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .scroll-wrap { max-height: 390px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-elevated); transition: max-height 0.4s ease; }
  .scroll-wrap.expanded { max-height: 2000px; }
  .scroll-wrap table { font-size: 14px; }
  .scroll-wrap thead th { position: sticky; top: 0; background: var(--bg-elevated); z-index: 1; }
  .scroll-hint { text-align: center; font-size: 11px; color: var(--muted); padding: 6px; border-top: 1px dashed var(--border); }
  .scroll-wrap.expanded .scroll-hint { display: none; }
  tr.me-row { background: color-mix(in srgb, var(--gold) 14%, transparent); outline: 1px solid color-mix(in srgb, var(--gold) 50%, transparent); outline-offset: -1px; }
  .my-status { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--bg-elevated); border: 1px solid var(--border); }
  .status-icon { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; }
  .my-status.alive .status-icon { background: var(--good); color: #06130c; }
  .my-status.out .status-icon { background: rgba(210,38,48,0.22); color: #FF6672; }
  .status-label { font-weight: 700; font-size: 15px; }
  .status-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .banner { background: color-mix(in srgb, var(--brick) 18%, var(--bg-elevated)); border: 1px solid var(--brick); color: var(--ink); padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
  .footer-note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 20px; }
  a.link { color: var(--gold); cursor: pointer; }
  .login-hero {
    position: relative;
    background:
      linear-gradient(100deg, transparent 28%, rgba(255,255,255,0.65) 44%, rgba(255,255,255,0.2) 53%, transparent 68%),
      radial-gradient(circle at 25% -10%, rgba(255,255,255,0.55), transparent 55%),
      linear-gradient(180deg, #FFEC9A 0%, #FBD24A 22%, #F0AC12 45%, #C8860A 68%, #8A5A0B 100%);
    border-bottom: 4px solid #6B4A12;
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.25), inset 0 2px 1px rgba(255,255,255,0.6);
    padding: calc(env(safe-area-inset-top, 0px) + 28px) 20px 20px;
    text-align: center;
  }
  .login-hero h1 { font-size: 40px; letter-spacing: 0.05em; margin: 0 0 6px; }
  .login-hero .muted { color: #3A2706 !important; opacity: 0.85 !important; }
  .authtabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .authtabs button { flex: 1; }
  .sched-row { border-bottom: 1px solid var(--border); padding: 8px 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
  .sched-row select { width: auto; }
  details.sched-browser summary { cursor: pointer; font-weight: 600; padding: 4px 0; }

  .scorecard {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 18px;
    background:
      radial-gradient(circle at 50% -20%, rgba(255,255,255,0.08), transparent 55%),
      linear-gradient(180deg, #16211A 0%, #0A100B 100%);
    border: 3px solid var(--gold);
    box-shadow: 0 6px 16px rgba(0,0,0,0.5), inset 0 0 22px rgba(0,0,0,0.5);
  }
  .scorecard-head {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 8px 16px 6px; gap: 8px;
    font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em;
    color: rgba(255,255,255,0.55);
  }
  .scorecard-head > span:last-child { justify-self: end; }
  .scorecard-live { justify-self: center; color: #FFD60A; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; text-transform: none; white-space: nowrap; }
  .status-pill {
    font-family: "Bebas Neue", sans-serif; font-size: 15px; letter-spacing: 0.05em;
    padding: 2px 13px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.45);
  }
  .status-pill.live { color: #FFD60A; text-shadow: 0 0 2px rgba(255,214,10,0.85); }
  .status-pill.final { color: #4CE08A; text-shadow: 0 0 2px rgba(76,224,138,0.85); }
  .status-pill.scheduled { color: rgba(255,255,255,0.65); text-shadow: none; }
  .matchup { display: flex; }
  .team-box { flex: 1; padding: 12px 8px 20px; text-align: center; position: relative; }
  .team-box + .team-box { border-left: 1px solid rgba(255,255,255,0.12); }
  .team-box.picked { box-shadow: inset 0 0 0 2px var(--gold), inset 0 0 14px rgba(255,214,10,0.25); border-radius: 8px; }
  .team-name {
    color: #FAFAF8; font-weight: 800; font-size: 14px; letter-spacing: 0.02em; text-transform: uppercase;
    margin-bottom: 10px; min-height: 2.2em; display: flex; align-items: center; justify-content: center;
    text-shadow: 0 1px 1px rgba(0,0,0,0.7);
  }
  .team-score {
    font-family: "Bebas Neue", sans-serif; font-size: 74px; line-height: 1; letter-spacing: 0.01em;
    color: #FFD60A;
    text-shadow: 0 0 3px rgba(255,214,10,0.95), 0 0 9px rgba(255,214,10,0.5);
  }
  .team-box.winner .team-score {
    color: #4CE08A;
    text-shadow: 0 0 3px rgba(76,224,138,0.95), 0 0 9px rgba(76,224,138,0.55);
  }
  .team-box.loser .team-score {
    color: var(--brick);
    text-shadow: 0 0 3px rgba(210,38,48,0.85), 0 0 9px rgba(210,38,48,0.45);
    opacity: 0.9;
  }
  .pts-badge { font-size: 22px; padding: 4px 12px; font-weight: 800; }
  .badge.missed { background: rgba(210,38,48,0.22); color: #FF6672; font-size: 13px; }
  .team-tags { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; align-items: center; }
  .win-tag { font-size: 12px; font-weight: 800; color: #4CE08A; text-transform: uppercase; letter-spacing: 0.04em; text-shadow: 0 0 3px rgba(76,224,138,0.55); }
  .pick-tag { font-size: 12px; font-weight: 800; color: var(--gold); text-transform: uppercase; letter-spacing: 0.04em; text-shadow: 0 0 3px rgba(255,214,10,0.45); }
  .scorecard-foot {

  if (!w) return false;

  const kicks = (w.games||[]).map(g => g.kickoff).filter(Boolean).map(k => new Date(k).getTime());
  if (!kicks.length) return false;
  return Date.now() >= Math.min(...kicks);
}
function weeklyScore(weekNum, playerId){
  const w = getWeek(weekNum); const p = STATE.picks[pickDocId(weekNum, playerId)];
  if (!w || !p) return 0;
  let score = 0;
  for (const g of w.games){
    if (g.isTiebreaker) continue;
    const pick = p.gamePicks && p.gamePicks[g.id];
    if (!pick || !g.winner) continue;
    if (pick.winner === g.winner) score += pick.value;
  }
  return score;
}
function tiebreakerDiff(weekNum, playerId){
  const w = getWeek(weekNum); const p = STATE.picks[pickDocId(weekNum, playerId)];
  if (!w || !p || !p.tiebreaker) return Infinity;
  const tb = w.games.find(g => g.isTiebreaker);
  if (!tb || tb.awayScore == null || tb.homeScore == null) return Infinity;
  return Math.abs((tb.awayScore + tb.homeScore) - p.tiebreaker.total);

function timeAgo(iso){
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff/60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins/60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs/24);
  if (days < 7) return days + 'd ago';
  return new Date(iso).toLocaleDateString();
}

function rankedTable(rows, valueKey, prizeAmounts, sectionId){

function computeMoneyTotals(){
  const players = Object.keys(STATE.players);
  const totals = {}; players.forEach(pid => totals[pid] = 0);
  if (STATE.meta.weekly1st == null && STATE.meta.weekly2nd == null && STATE.meta.weekly3rd == null) return totals;
  const prizeAmounts = [STATE.meta.weekly1st, STATE.meta.weekly2nd, STATE.meta.weekly3rd];
  Object.keys(STATE.weeks).map(Number).forEach(n => {
    const w = getWeek(n);
    const tb = w ? w.games.find(g => g.isTiebreaker) : null;
    const tbFinal = tb && tb.awayScore != null && tb.homeScore != null;
    let rows = players.map(pid => {
      const pick = STATE.picks[pickDocId(n,pid)];
      return { pid, score: weeklyScore(n, pid), diff: tbFinal ? tiebreakerDiff(n, pid) : Infinity, submitted: !!pick, eligible: !(pick && (pick.isHammer || pick.isInsurance)) };
    }).filter(r => r.submitted);
    rows.sort((a,b) => b.score - a.score || a.diff - b.diff);
    let prizeRank = 0;
    rows.forEach(r => {
      if (!r.eligible) return;
      const amt = prizeAmounts[prizeRank];
      if (amt != null) totals[r.pid] = (totals[r.pid]||0) + amt;
      prizeRank++;
    });
  });
  return totals;
}

function survivorStatus(playerId, pointValue){
  const weeks = Object.keys(STATE.weeks).map(Number).sort((a,b)=>a-b);
  for (const n of weeks){
    const w = getWeek(n);
    if (!w || !w.games || !w.games.length) continue;
    const p = STATE.picks[pickDocId(n, playerId)];
    if (!p){ return { alive:false, eliminatedWeek:n, reason:'no picks submitted' }; }
    const entry = p.isHammer
      ? Object.entries(p.gamePicks||{})[0]
      : Object.entries(p.gamePicks||{}).find(([gid,pick]) => pick.value === pointValue);
    if (!entry){ return { alive:false, eliminatedWeek:n, reason:'no ' + pointValue + '-pt pick found' }; }
    const [gameId, pick] = entry;
    const game = w.games.find(g => g.id === gameId);
    if (!game || !game.winner) return { alive:true, pendingWeek:n }; // not decided yet — stop here, still alive
    if (game.winner === 'tie') return { alive:false, eliminatedWeek:n, reason: 'game tied' };
    if (pick.winner !== game.winner) return { alive:false, eliminatedWeek:n, reason: (pick.winner==='away'?game.away:game.home) + ' lost' };
  }
  return { alive:true };
}

  const players = playerIds || Object.keys(STATE.players);

  const me = session.playerId ? survivorStatus(session.playerId, pointValue) : null;

function gameDayET(iso){
  if (!iso) return '';
  const d = new Date(new Date(iso).getTime() - 4*3600*1000); // approximate ET offset so MNF (UTC after midnight) still lands on the right day
  return d.toISOString().slice(0,10);
}
function addDays(dateStr, n){
  const d = new Date(dateStr + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0,10);
}

  async offerLegacyClaim(playerId, displayName){
    try {
      const { data: legacyPlayers } = await sb.from('legacy_players').select('*');
      if (!legacyPlayers || !legacyPlayers.length) return;
      const norm = s => s.trim().toLowerCase().replace(/\s+/g,' ');
      const target = norm(displayName);
      const targetWords = target.split(' ');
      const scored = legacyPlayers.map(lp => {
        const name = norm(lp.clean_name);
        if (name === target) return { lp, score: 100 };
        const words = name.split(' ');
        let common = 0;
        targetWords.forEach(w => { if (words.includes(w)) common++; });
        let score = (common / Math.max(targetWords.length, words.length)) * 80;

      });
      if (error) throw error;
      const wasUsed = STATE.players[adminEditPlayerId] && STATE.players[adminEditPlayerId].hammerUsed;
      if (adminEditHammerMode && !wasUsed){
        await sb.from('profiles').update({ hammer_used: true }).eq('id', adminEditPlayerId);
      } else if (!adminEditHammerMode && wasHammerThisWeek){
        await sb.from('profiles').update({ hammer_used: false }).eq('id', adminEditPlayerId);
      }
      await loadProfiles();
      if (adminEditPlayerId === session.playerId) session.hammerUsed = STATE.players[session.playerId].hammerUsed;
      showToast('Picks saved for ' + displayName + '.');
      App.adminCancelEdit();
    } catch(e){ showError(e); }
  },
  adminCancelEdit(){
    adminEditPlayerId = null; adminEditWeek = null; adminEditDraft = null; adminEditExisting = null; adminEditHammerMode = false;
    render();
  }
};
window.App = new Proxy(App, {
  get(target, prop){
    const val = target[prop];
    if (typeof val !== 'function') return val;
    return function(...args){
      const result = val.apply(target, args);
      if (result && typeof result.then === 'function'){
        setLoading(true);
        return result.finally(() => setLoading(false));
      }
      return result;
    };
  }
});

function injectTeamDatalists(){
  if (document.getElementById('nfl-teams')) return;
  const nfl = document.createElement('datalist'); nfl.id = 'nfl-teams';
  nfl.innerHTML = NFL_TEAMS.map(t => '<option value="' + esc(t) + '">').join('');
  const fbs = document.createElement('datalist'); fbs.id = 'fbs-teams';
  fbs.innerHTML = FBS_TEAMS.map(t => '<option value="' + esc(t) + '">').join('');
  document.body.appendChild(nfl); document.body.appendChild(fbs);
}

// ---------- boot ----------
async function boot(){
  setLoading(true);
  try {
    injectTeamDatalists();
    const { data: { session: authSession } } = await sb.auth.getSession();
    if (authSession && authSession.user){
      const { data: profile } = await sb.from('profiles').select('*').eq('id', authSession.user.id).maybeSingle();
      if (profile) session = { playerId: authSession.user.id, displayName: profile.display_name, isAdmin: profile.is_admin, hammerUsed: profile.hammer_used };
    }
    try { await fetch('/api/refresh-scores'); } catch(e) { showToast('Couldn\'t reach live scores — showing the last saved results.'); }
    await loadConfig();
    await loadWeekGames(STATE.meta.currentWeek);
    if (session.playerId) await loadOwnPick(STATE.meta.currentWeek, session.playerId);
    view = session.playerId ? 'picks' : 'login';
    render();
  } catch(e){ showError(e); } finally { setLoading(false); }
}
boot();
})();
</script>
